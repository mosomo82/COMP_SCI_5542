name: CI

on:
  push:
    branches: [ main, lab9-enhancements ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      SNOWFLAKE_ACCOUNT: ${{ secrets.SNOWFLAKE_ACCOUNT }}
      SNOWFLAKE_USER: ${{ secrets.SNOWFLAKE_USER }}
      SNOWFLAKE_PASSWORD: ${{ secrets.SNOWFLAKE_PASSWORD }}
      SNOWFLAKE_WAREHOUSE: ${{ secrets.SNOWFLAKE_WAREHOUSE }}
      SNOWFLAKE_DATABASE: ${{ secrets.SNOWFLAKE_DATABASE }}
      SNOWFLAKE_SCHEMA: ${{ secrets.SNOWFLAKE_SCHEMA }}
      SNOWFLAKE_AUTHENTICATOR: ${{ secrets.SNOWFLAKE_AUTHENTICATOR }}

    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
        
    - name: Install dependencies
      run: |
        pip install -r Week_6/requirements.txt
        pip install requests pandas altair streamlit "google-generativeai>=0.4.0"

    - name: Check Week 6 secrets
      id: week6-secrets
      run: |
        missing=()
        required_vars="GEMINI_API_KEY SNOWFLAKE_ACCOUNT SNOWFLAKE_USER SNOWFLAKE_WAREHOUSE SNOWFLAKE_DATABASE SNOWFLAKE_SCHEMA"
        for var in $required_vars; do
          value=$(printenv "$var")
          if [ -z "$value" ]; then
            missing+=("$var")
          fi
        done
        if [ -z "${SNOWFLAKE_PASSWORD}" ] && [ -z "${SNOWFLAKE_AUTHENTICATOR}" ]; then
          missing+=("SNOWFLAKE_PASSWORD or SNOWFLAKE_AUTHENTICATOR")
        fi
        if [ ${#missing[@]} -gt 0 ]; then
          echo "Missing Week_6 secrets: ${missing[*]}"
          echo "run_week6=false" >> "$GITHUB_OUTPUT"
          exit 0
        fi
        echo "run_week6=true" >> "$GITHUB_OUTPUT"

    - name: Run Evaluation Scenarios
      if: steps.week6-secrets.outputs.run_week6 == 'true'
      run: |
        cd Week_6
        python eval_scenarios.py --json

    - name: Skip Week 6 tests (missing secrets)
      if: steps.week6-secrets.outputs.run_week6 != 'true'
      run: |
        echo "Week_6 tests skipped because required Snowflake/Gemini secrets are not available."
        echo "Add the secrets listed in Week_6/README.md to enable CI execution."

    - name: Assert 70% Pass Rate
      if: steps.week6-secrets.outputs.run_week6 == 'true'
      run: |
        python -c "
        import json, sys
        try:
            with open('Week_6/eval_results.json', 'r') as f:
                results = json.load(f)
            total = len(results)
            passed = sum(1 for r in results if r.get('pass', False))
            rate = passed / total if total > 0 else 0
            print(f'Pass rate: {rate*100:.1f}%')
            if rate < 0.7:
                print('Error: Pass rate below 70%')
                sys.exit(1)
        except Exception as e:
            print(f'Failed to parse results: {e}')
            sys.exit(1)
        "
