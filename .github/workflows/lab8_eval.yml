name: Lab 8 Mock Evaluation Pipeline

on:
  push:
    paths:
      - 'Week_8/**'
  pull_request:
    paths:
      - 'Week_8/**'

jobs:
  evaluate-mock:
    name: Run Domain Adaptation Evaluation (Mock)
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python 3.10
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"

      - name: Install necessary base dependencies
        run: |
          python -m pip install --upgrade pip

      - name: Run 5-Dim Rubric Evaluation
        working-directory: ./Week_8
        run: |
          python app/evaluation.py --mode mock --queries data/evaluation_queries.json
