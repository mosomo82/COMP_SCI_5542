name: CI

on:
  push:
    branches: [ main, lab9-enhancements ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
        
    - name: Install dependencies
      run: |
        pip install -r Week_6/requirements.txt
        pip install requests pandas altair streamlit "google-generativeai>=0.4.0"
        
    - name: Run Evaluation Scenarios
      env:
        GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        SNOWFLAKE_ACCOUNT: ${{ secrets.SNOWFLAKE_ACCOUNT }}
        SNOWFLAKE_USER: ${{ secrets.SNOWFLAKE_USER }}
        SNOWFLAKE_PASSWORD: ${{ secrets.SNOWFLAKE_PASSWORD }}
        SNOWFLAKE_WAREHOUSE: ${{ secrets.SNOWFLAKE_WAREHOUSE }}
        SNOWFLAKE_DATABASE: ${{ secrets.SNOWFLAKE_DATABASE }}
        SNOWFLAKE_SCHEMA: ${{ secrets.SNOWFLAKE_SCHEMA }}
      run: |
        cd Week_6
        python eval_scenarios.py --json
        
    - name: Assert 70% Pass Rate
      run: |
        python -c "
        import json, sys
        try:
            with open('Week_6/eval_results.json', 'r') as f:
                results = json.load(f)
            total = len(results)
            passed = sum(1 for r in results if r.get('pass', False))
            rate = passed / total if total > 0 else 0
            print(f'Pass rate: {rate*100:.1f}%')
            if rate < 0.7:
                print('Error: Pass rate below 70%')
                sys.exit(1)
        except Exception as e:
            print(f'Failed to parse results: {e}')
            sys.exit(1)
        "
